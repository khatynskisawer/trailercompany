<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка возраста</title>
</head>
<body>
<h1>Задание ребенка</h1>
<script>
    let age = prompt("Введите ваш возраст:");
	//alert(typeof(age)===undefined);
	//if(age===''){alert("dadadada");}
    if (age !== null && age!=='') {
        age = parseInt(age, 10);
        if (age < 18) {
            let permission = confirm("Родители разрешили?");
            if (permission) {
                let password = prompt("Введите пароль:");
                if (password === "Даем добро") {
                    alert("Добро пожаловать!");
                } else if (password === null) {
                    alert("Вход отменён.");
                } else {
                    alert("Пароль неверен.");
                }
            } else {
                alert("Доступ запрещен.");
            }
        } else {
            alert("Добро пожаловать!");
        }
    } else {
        alert("Вход отменён.");
    }
</script>
</body>
</html>
